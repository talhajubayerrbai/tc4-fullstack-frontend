name: Deploy tc4-frontend

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git revision to deploy'
        required: false
      udap_run_id:
        description: 'UDAP run id'
        required: false

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Build Docker image (smoke test)
        run: docker build -t tc4-frontend-test:${{ inputs.revision || github.sha }} .

  provision:
    name: Provision
    runs-on: ubuntu-latest
    needs: test
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      alb_dns: ${{ steps.tf_output.outputs.alb_dns }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr_login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.revision || github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ vars.SERVICE_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ vars.SERVICE_NAME }}:$IMAGE_TAG

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="service_name=${{ vars.SERVICE_NAME }}" \
            -var="image_tag=${{ inputs.revision || github.sha }}"

      - name: Get ALB DNS
        id: tf_output
        working-directory: infra
        run: |
          echo "alb_dns=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - name: Wait for service to become healthy
        env:
          ALB_DNS: ${{ needs.provision.outputs.alb_dns }}
        run: |
          echo "Polling http://$ALB_DNS ..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Live URL: http://$ALB_DNS"
              exit 0
            fi
            sleep 10
          done
          echo "Service did not become healthy within 15 minutes."
          exit 1
