<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TC4 Frontend</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f0f4f8; }
    h1 { color: #2d3748; }
    button { padding: 12px 28px; font-size: 16px; background: #4299e1; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2b6cb0; }
    #result { margin-top: 24px; padding: 16px; background: white; border-radius: 8px; font-family: monospace; font-size: 15px; min-width: 320px; text-align: center; color: #2d3748; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
  </style>
</head>
<body>
  <h1>TC4 Fullstack Demo</h1>
  <button onclick="callBackend()">Call Backend /health</button>
  <div id="result"></div>
  <script>
    const BACKEND_URL = "http://tc4-backend-alb-1181263056.us-east-1.elb.amazonaws.com";
    async function callBackend() {
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.textContent = 'Loading...';
      try {
        const res = await fetch(BACKEND_URL + '/health');
        const data = await res.json();
        el.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        el.textContent = 'Error: ' + e.message;
      }
    }
  </script>
</body>
</html>
